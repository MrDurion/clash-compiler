- BlackBox:
    name: Clash.Sized.Internal.BitVector.high
    kind: Expression
    type: "high :: Bit"
    template: "1"
    workInfo: Constant
- BlackBox:
    name: Clash.Sized.Internal.BitVector.low
    kind: Expression
    type: "low :: Bit"
    template: "0"
    workInfo: Constant
- BlackBox:
    name: Clash.Sized.Internal.BitVector.pack#
    kind: Expression
    type: "pack# :: Bit -> BitVector 1"
    template: ~ARG[0]
    workInfo: Never
- BlackBox:
    name: Clash.Sized.Internal.BitVector.unpack#
    kind: Expression
    type: "unpack# :: BitVector 1 -> Bit"
    template: ~ARG[0]
    workInfo: Never
- BlackBox:
    name: Clash.Sized.Internal.BitVector.and##
    kind: Expression
    type: "and## :: Bit -> Bit -> Bit"
    template: ~ARG[0] ~ARG[1]
- BlackBox:
    name: Clash.Sized.Internal.BitVector.complement##
    kind: Expression
    type: "complement## :: Bit -> Bit"
    template: "! ~ARG[0]"
- BlackBox:
    name: Clash.Sized.Internal.BitVector.++#
    kind: Expression
    type: "(++#) :: KnownNat m => BitVector n -> BitVector m -> BitVector (n + m)"
    template: "~ARG[1] ++ ~ARG[2] ~LIT[0]"
    workInfo: Never
- BlackBox:
    name: Clash.Sized.Internal.BitVector.split#
    kind: Expression
    type: |-
      split# :: KnownNat n        -- ARG[0]
              => BitVector (m + n) -- ARG[1]
              -> (BitVector m, BitVector n)
    template: ~ARG[1] ~LIT[0]
    workInfo: Never
- BlackBox:
    name: Clash.Sized.Internal.BitVector.fromInteger#
    kind: Expression
    type: "fromInteger# ::
      KnownNat n => Integer -> Integer -> BitVector n"
    template: ~ARG[0] ~ARG[1]
    workInfo: Never
- BlackBox:
    name: Clash.Sized.Internal.BitVector.undefined#
    kind: Expression
    type: "undefined# :: forall n . KnownNat n => BitVector n"
    template: ~ERRORO
    workInfo: Constant
- Primitive:
    name: Clash.Sized.Internal.BitVector.checkUnpackUndef
    primType: Function
    workInfo: Never
- BlackBox:
    name: Clash.Sized.Internal.BitVector.xToBV
    kind: Expression
    type: "xToBV :: KnownNat n => BitVector n -> BitVector n"
    template: ~ARG[1]
    workInfo: Never
