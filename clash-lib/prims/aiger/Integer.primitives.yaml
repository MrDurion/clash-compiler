- BlackBox:
    name: Clash.Sized.Internal.BitVector.toInteger#
    kind: Expression
    template: ~ARG[1] ~LIT[0]
    workInfo: Never
- BlackBox:
    name: Clash.Sized.Internal.BitVector.fromInteger##
    kind: Expression
    template: ~ARG[1]
    workInfo: Never
- BlackBox:
    name: Clash.Sized.Internal.BitVector.fromInteger#
    kind: Expression
    template: ~LIT[0] ~ARG[2]
    workInfo: Never
- BlackBox:
    name: Clash.Sized.Internal.Signed.fromInteger#
    kind: Expression
    template: ~LIT[0] ~ARG[1]
    workInfo: Never
